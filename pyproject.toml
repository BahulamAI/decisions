[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decissions"
version = "0.3.0a1"
description = "One policy-driven runtime for safety assessment, chart rendering and text classification"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "BahulamAI"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
tracing = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-http>=1.20"]
runtime = ["pydantic>=2.7,<3", "pydantic-settings>=2.3", "httpx>=0.27,<1", "redis>=5,<8", "prometheus-client>=0.20", "opentelemetry-api>=1.20"]
api = ["decissions[runtime]"]
decisions = ["pydantic>=2.7,<3"]
presentations = ["decissions[runtime]", "jsonschema>=4.23,<5"]
jev = ["httpx>=0.27,<1"]
dev = ["pydantic-settings>=2.3", "redis>=5,<8", "prometheus-client>=0.20", "opentelemetry-api>=1.20", "pytest>=8,<10", "httpx>=0.27,<1", "pydantic>=2.7,<3", "jsonschema>=4.23,<5"]

[project.urls]
Repository = "https://github.com/BahulamAI/decisions"
Issues = "https://github.com/BahulamAI/decisions/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
decissions = ["py.typed", "presentations/catalog/*.json", "renderers/workplane/contracts/*.json", "renderers/workplane/contracts/LICENSE.workplane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
